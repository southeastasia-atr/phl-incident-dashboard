            y: { ticks: { color: CHART_DEFAULTS.color, font:{size:11} }, grid: { display: false }, border: { color: 'transparent' } }
          }
        }
      });
    }

    function makeVertBar(canvasId, labels, data, colors) {
      destroyChart(canvasId);
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      clearChartEmpty(canvasId);
      if (!data.some(function(v){return v>0;})) { showChartEmpty(canvasId, 'No data'); return; }
      metricsCharts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: { labels: labels, datasets: [{ data: data, backgroundColor: colors||CHART_DEFAULTS.accent, borderRadius: 3, borderSkipped: false }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: CHART_DEFAULTS.color, font:{size:11}, maxRotation: 30 }, grid: { display: false }, border: { color: 'transparent' } },
            y: { ticks: { color: CHART_DEFAULTS.color, font:{size:11} }, grid: { color: CHART_DEFAULTS.gridColor }, border: { color: 'transparent' } }
          }
        }
      });
    }

    function makePie(canvasId, labels, data, column) {
      destroyChart(canvasId);
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      clearChartEmpty(canvasId);
      if (!data.some(function(v){return v>0;})) { showChartEmpty(canvasId, 'No data'); return; }
      var PIE_COLORS = ['#e8962a','#4d90c4','#00b050','#e53935','#cc00cc','#9b59b6','#4472c4','#c8a800','#e91e63','#888888','#3a7abf','#d4791e'];
      // If this chart's column matches a categorical map layer's own column
      // (e.g. Incident Type), reuse that layer's colors for visual
      // consistency with the map. Otherwise fall back to the generic palette.
      var matchingLayerId = column && Object.keys(categoricalLayers).filter(function(id) {
        return categoricalLayers[id].column === column;
      })[0];
      var matchingLayer = matchingLayerId && categoricalLayers[matchingLayerId];
      metricsCharts[canvasId] = new Chart(ctx, {
        type: 'pie',
        data: { labels: labels, datasets: [{ data: data, backgroundColor: labels.map(function(l,i){
          if (matchingLayer) return matchingLayer.colorFor(l);
          return PIE_COLORS[i%PIE_COLORS.length];
        }), borderColor: '#161b22', borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'right', labels: { color: CHART_DEFAULTS.color, font:{size:11}, padding:10, boxWidth:12 } } }
        }
      });
    }

    function makeSingleBar(canvasId, value) {
      destroyChart(canvasId);
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      clearChartEmpty(canvasId);
      if (!value) { showChartEmpty(canvasId, 'No data'); return; }
      metricsCharts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: { labels: ['Rounds / items'], datasets: [{ data: [value], backgroundColor: CHART_DEFAULTS.blue, borderRadius: 4, borderSkipped: false }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx){ return ' ' + ctx.raw.toLocaleString() + ' rounds/items'; } } } },
          scales: {
            x: { ticks: { color: CHART_DEFAULTS.color, font:{size:11} }, grid:{display:false}, border:{color:'transparent'} },
            y: { ticks: { color: CHART_DEFAULTS.color, font:{size:11} }, grid:{color:CHART_DEFAULTS.gridColor}, border:{color:'transparent'} }
          }
        }
      });
    }

    // Card width, per chart kind — cosmetic sizing only, not something worth
    // putting in schema.json itself. A client can still get a specific size
    // by adding a matching CSS class later; this just picks a sensible
    // default so a new chart kind doesn't render at some arbitrary width.
    var METRICS_CARD_SIZE_BY_KIND = {
      'pie': 'metrics-card-medium',
      'single-bar': 'metrics-card-ammo',
      'vert-bar': 'metrics-card-wide',
      'line': 'metrics-card-wide',
      'stacked-bar': 'metrics-card-wide',
    };

    // Generates the Metrics panel's sections/cards/<canvas> elements from
    // schema.layers' metrics definition. This used to be static HTML
    // hardcoded to SEA's exact 7 charts — deliberately left that way when
    // Metrics was first made schema-driven, since only the chart-drawing
    // logic needed proving at the time. A second, differently-shaped schema
    // is what actually needs this: without it, a client's chart has no
    // <canvas> to render into at all, however correct the JS behind it is.
    var COPY_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    var CHECK_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    function buildMetricsPanel(schema) {
      var container = document.getElementById('metricsInner');
      var metricsDef = ((schema && schema.layers) || []).filter(function(l) { return l.type === 'metrics'; })[0];
      var sections = (metricsDef && metricsDef.sections) || FALLBACK_METRICS_SECTIONS;

      container.innerHTML = sections.map(function(section) {
        var rowClass = 'metrics-row' + (section.rowLayout === 'nowrap' ? ' metrics-row-nowrap' : '');
        var cardsHtml = (section.charts || []).map(function(chartDef) {
          var sizeClass = METRICS_CARD_SIZE_BY_KIND[chartDef.kind] || '';
          var wrapClass = chartDef.kind === 'pie' ? 'metrics-chart-wrap metrics-pie-wrap' : 'metrics-chart-wrap';
          var title = chartDef.title || chartDef.id;
          return '<div class="metrics-card' + (sizeClass ? ' ' + sizeClass : '') + '">' +
            '<button type="button" class="metrics-copy-btn" data-chart-id="' + escHtml(chartDef.id) + '" title="Copy chart as image">' + COPY_ICON_SVG + '</button>' +
            '<div class="metrics-card-title">' + escHtml(title) + '</div>' +
            '<div class="' + wrapClass + '"><canvas id="' + escHtml(chartDef.id) + '"></canvas></div>' +
            '</div>';
        }).join('');
        return '<div class="metrics-section">' +
          '<h2 class="metrics-section-title">' + escHtml(section.title || '') + '</h2>' +
          '<div class="' + rowClass + '">' + cardsHtml + '</div>' +
          '</div>';
      }).join('');

      // One delegated listener covers every card, including any redrawn later.
      container.addEventListener('click', function(e) {
        var btn = e.target.closest('.metrics-copy-btn');
        if (!btn) return;
        copyChartAsImage(btn.dataset.chartId, btn);
      });
    }

    // Copies a chart's canvas to the clipboard as a PNG. Chart.js canvases
    // are transparent by default — pasted as-is onto a white document page,
    // the dashboard's light-colored labels would be unreadable. This draws
    // the chart onto an offscreen canvas with the card's own dark background
    // filled in first, so the pasted image looks like a proper snapshot.
    function copyChartAsImage(canvasId, btn) {
      var source = document.getElementById(canvasId);
      if (!source) return;

      var snapshot = document.createElement('canvas');
      snapshot.width = source.width;
      snapshot.height = source.height;
      var ctx = snapshot.getContext('2d');
      ctx.fillStyle = '#161b22'; // matches .metrics-card background
      ctx.fillRect(0, 0, snapshot.width, snapshot.height);
      ctx.drawImage(source, 0, 0);

      snapshot.toBlob(function(blob) {
        if (!blob) { console.error('Chart copy failed: could not create image blob.'); return; }
        if (!navigator.clipboard || !window.ClipboardItem) {
          console.error('Chart copy failed: clipboard image support is not available in this browser.');
          return;
        }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function() {
          showCopyFeedback(btn);
        }).catch(function(err) {
          console.error('Chart copy failed:', err);
        });
      });
    }

    function showCopyFeedback(btn) {
      var original = btn.innerHTML;
      btn.innerHTML = CHECK_ICON_SVG;
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = original;
        btn.classList.remove('copied');
      }, 1200);
    }

    // Computes and draws one chart from its schema definition. Unrecognized
    // kinds (line, stacked-bar — documented in schema.json but not yet
    // implemented, since SEA doesn't use them) are skipped with a console
    // warning rather than breaking the rest of the panel.
    function renderChartFromDef(chartDef, rows) {
      var id = chartDef.id;
      if (chartDef.kind === 'horiz-bar') {
        var entries = chartDef.groups
          ? sumGroups(rows, chartDef.groups).map(function(d){ return [d.label, d.value]; })
          : countCategorical(rows, chartDef.column, getVocabForColumn(chartDef.column));
        makeHorizBar(id, entries.map(function(e){return e[0];}), entries.map(function(e){return e[1];}), chartDef.color || CHART_DEFAULTS.accent);
      } else if (chartDef.kind === 'vert-bar') {
        var entries = computeVertBarData(rows, chartDef);
        var labels = entries.map(function(e){ return e[0]; });
        var data = entries.map(function(e){ return chartDef.roundSum ? Math.round(e[1]) : e[1]; });
        var colors = labels.map(function(_,i){ return i%2===0 ? CHART_DEFAULTS.accent : CHART_DEFAULTS.blue; });
        makeVertBar(id, labels, data, colors);
      } else if (chartDef.kind === 'pie') {
        var entries = countCategorical(rows, chartDef.column, getVocabForColumn(chartDef.column));
        makePie(id, entries.map(function(e){return e[0];}), entries.map(function(e){return e[1];}), chartDef.column);
      } else if (chartDef.kind === 'single-bar') {
        makeSingleBar(id, sumCol(rows, chartDef.column));
      } else {
        console.warn('Chart kind not yet implemented, skipping:', chartDef.kind, id);
      }
    }

    function renderMetrics(rows) {
      if (!rows || !rows.length) rows = incidents;

      var metricsDef = ((SCHEMA && SCHEMA.layers) || []).filter(function(l) { return l.type === 'metrics'; })[0];
      var sections = (metricsDef && metricsDef.sections) || FALLBACK_METRICS_SECTIONS;

      sections.forEach(function(section) {
        (section.charts || []).forEach(function(chartDef) {
          renderChartFromDef(chartDef, rows);
        });
      });
    }
  </script>

  <style>
    /* metrics panel fills .map-content */
    .metrics-panel {
      position: absolute;
      inset: 0;
      background: #0d1117;
      overflow-y: auto;
      z-index: 10;
    }
    .metrics-inner { padding: 16px 16px 32px; }
    .metrics-section { margin-bottom: 24px; }
    .metrics-section-title {
      font-family: 'Georgia', serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase;
      color: #e8962a;
      border-bottom: 1px solid #21262d;
      padding-bottom: 6px; margin: 0 0 12px 0;
    }
    .metrics-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .metrics-row-nowrap { flex-wrap: nowrap; }
    .metrics-row-nowrap .metrics-card { flex: 1 1 0; min-width: 0; }
    .metrics-card-ammo { flex: 0 0 160px !important; min-width: 0; }
    .metrics-card {
      position: relative;
      flex: 1 1 200px;
      background: #161b22; border: 1px solid #21262d;
      border-radius: 6px; padding: 12px 14px 14px;
      display: flex; flex-direction: column;
    }
    .metrics-copy-btn {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      background: #21262d; border: 1px solid #30363d; border-radius: 4px;
      color: #8b949e; cursor: pointer;
      opacity: 0; transition: opacity .15s, color .15s, border-color .15s;
      z-index: 2;
    }
    .metrics-card:hover .metrics-copy-btn { opacity: 1; }
    .metrics-copy-btn:hover { color: #e8962a; border-color: #e8962a; }
    .metrics-copy-btn.copied { opacity: 1; color: #00b050; border-color: #00b050; }
    .metrics-copy-btn svg { width: 13px; height: 13px; }
    .metrics-card-narrow { flex: 0 1 150px; }
    .metrics-card-medium { flex: 0 1 240px; }
    .metrics-card-wide   { flex: 1 1 360px; }
    .metrics-card-title {
      font-size: 10px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      color: #8b949e; margin-bottom: 10px;
    }
    .metrics-chart-wrap { position: relative; flex: 1; min-height: 140px; }
    .metrics-pie-wrap   { min-height: 180px; }
    #chartFirearms { min-height: 260px; }
    .metrics-chart-wrap:has(#chartFirearms) { min-height: 260px; }
    #chartProvinces { min-height: 300px; }
    .metrics-chart-wrap:has(#chartProvinces) { min-height: 300px; }
    #chartArmsScore { min-height: 300px; }
    .metrics-chart-wrap:has(#chartArmsScore) { min-height: 300px; }
    .metrics-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; min-height: 80px;
      font-size: 11px; color: #484f58; font-style: italic;
    }
    .map-legend { z-index: 11; }

    .popup-title {
      font-size: 12px;
      font-weight: 500;
      margin: 4px 0 6px;
      line-height: 1.4;
      color: #e6edf3;
    }
    .popup-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11.5px;
      color: #8b949e;
    }
  </style>

  <script>
    // RESIZABLE SPLIT PANE
    (function() {
      var divider = document.getElementById('divider');
      var layout  = divider.closest('.layout');
      var dragging = false;

      divider.addEventListener('mousedown', function(e) {
        dragging = true;
        divider.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        var rect  = layout.getBoundingClientRect();
        var leftW = e.clientX - rect.left;
        var total = rect.width - 8; // subtract divider width
        leftW = Math.max(200, Math.min(leftW, total - 200)); // min 200px each side
        var pct = (leftW / rect.width * 100).toFixed(2);
        layout.style.gridTemplateColumns = pct + '% 8px 1fr';
        // tell MapLibre the container resized
        if (window.map) map.resize();
      });

      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (window.map) map.resize();
      });
    })();
  </script>

</body>
