  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- PapaParse (CSV parsing) -->

</head>
<body>

    <div class="header-inner">

          <line class="e" x1="190" y1="220" x2="310" y2="295"/>

          <line class="e" x1="480" y1="390" x2="460" y2="320"/>
          <line class="e" x1="480" y1="390" x2="530" y2="440"/>
          <line class="e" x1="355" y1="430" x2="530" y2="440"/>
          <circle class="nb" cx="295" cy="185" r="24"/>
          <circle class="nb" cx="310" cy="295" r="26"/>
          <circle class="nb" cx="265" cy="340" r="22"/>
          <circle class="nb" cx="420" cy="220" r="26"/>
          <circle class="nb" cx="460" cy="320" r="22"/>

      </span>
      <h1>Incident Map</h1>
      <nav class="country-nav" id="countryNav" aria-label="Select country">
        <!-- buttons injected by JS from COUNTRY_SOURCES -->
      </nav>
    </div>
  </header>

  <main class="layout">

    <!-- Map panel -->
    <section class="map-panel">

      <!-- Layer switcher: top strip inside map panel. Populated dynamically
           from schema.layers by buildLayerNav() — see the JS below. -->
      <div class="layer-switcher" id="layerSwitcher"></div>

      <!-- map and metrics share this space -->
      <div class="map-content">
        <div id="map"></div>

        <div id="metricsPanel" class="metrics-panel" style="display:none;">
          <div class="metrics-inner" id="metricsInner">
            <!-- sections/cards/canvases generated by buildMetricsPanel() from schema.layers -->
          </div>
        </div>

        <div class="map-legend" id="mapLegend"></div>
      </div>

    </section>

    <!-- Resizable divider -->
    <div class="divider" id="divider"></div>

    <!-- Table panel -->
    <section class="table-panel">
      <div class="table-toolbar">
        <span class="table-count" id="tableCount">-- incidents</span>

        <div class="filter-group">
          <label class="filter-label">From</label>
          <input type="date" id="filterDateFrom" class="filter-input filter-date" />
        </div>
        <div class="filter-group">
          <label class="filter-label">To</label>
          <input type="date" id="filterDateTo" class="filter-input filter-date" />
        </div>

        <!-- Multi-select filter groups generated by buildFilterControls()
             from schema.filters.multiSelect. display:contents keeps each
             generated .filter-group a direct flex child of .table-toolbar. -->
        <div id="multiSelectFilters" style="display:contents"></div>

        <div class="filter-group filter-search-group">
          <input type="text" id="filterSearch" class="filter-input filter-search" placeholder="Search…" />
        </div>

        <button id="filterReset" class="filter-reset" title="Clear all filters">✕</button>
      </div>
      <div class="table-scroll">
        <table id="incidentTable">
          <thead></thead>
          <tbody id="tableBody">
            <tr class="placeholder-row">
              <td colspan="99">Loading incidents...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // COLOR MAP BY INCIDENT TYPE
    const TYPE_COLORS = {
      'Seizure':            '#00b050',  // green
      'Diversion':          '#e53935',  // red
      'Illicit transfer':   '#cc00cc',  // magenta
      'Illicit use':        '#c8a800',  // golden yellow (legible on dark)
      'Illicit possession': '#c8a800',  // golden yellow
      'Illicit manufacture':'#ff9900',  // orange
      'Destruction':        '#4a4a4a',  // dark charcoal
      'UXO':                '#888888',  // mid-grey
      'Surrender':          '#4472c4',  // blue
      'Surrender/amnesty':  '#4472c4',  // blue
      'Armed clash':        '#e53935',  // red
      'IED':                '#ff9900',  // orange
      'Assassination':      '#9b59b6',  // purple
      'Kidnapping':         '#e91e63',  // pink
    };
    const DEFAULT_COLOR = '#8b949e';

    // CONVERGENCE CATEGORIES & COLORS
    const CONVERGENCE_COLORS = {
      'Drug trafficking':    '#e53935',  // red
      'Human trafficking':   '#e91e63',  // pink
      'Wildlife trafficking':'#00b050',  // green
      'Illicit business':    '#c8a800',  // golden yellow
      'Environmental crime': '#4d90c4',  // blue
      'Illicit goods':       '#ff9900',  // orange
      'Criminal services':   '#9b59b6',  // purple
    };
    const CONVERGENCE_DEFAULT = '#8b949e';

    function convergenceCategory(val) {
      if (!val) return null;
      var v = val.trim();
      for (var cat in CONVERGENCE_COLORS) {
        if (v.toLowerCase().startsWith(cat.toLowerCase())) return cat;
      }
      return null;
    }

    function convergenceColor(val) {
      var cat = convergenceCategory(val);
      return cat ? CONVERGENCE_COLORS[cat] : CONVERGENCE_DEFAULT;
    }

    // Return the first convergence category found in a (possibly multi-value) field
    function primaryConvergenceColor(field) {
      if (!field) return CONVERGENCE_DEFAULT;
      var parts = field.split(/[,;\n\r]+/);
      for (var i = 0; i < parts.length; i++) {
        var col = convergenceColor(parts[i].trim());
        if (col !== CONVERGENCE_DEFAULT) return col;
      }
      return CONVERGENCE_DEFAULT;
    }

    function typeColor(type) {
      if (!type) return DEFAULT_COLOR;
      for (const [key, val] of Object.entries(TYPE_COLORS)) {
        if (type.toLowerCase().includes(key.toLowerCase())) return val;
      }
      return DEFAULT_COLOR;
    }

    // MAP INITIALISATION
    // The values below are SEA's own defaults, used until schema.json loads
    // (the map has to construct synchronously; schema.json is fetched async).
    // applyMapViewFromSchema() below re-applies them from schema.map once
    // available — for SEA that's a same-value no-op; for a different client
    // it repositions the map before any data-driven fitBounds() runs.
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [122.0, 12.5],
      zoom: 5.5,
      minZoom: 4,
      maxZoom: 18,
    });

    function applyMapViewFromSchema(schema) {
      var view = schema && schema.map && schema.map.initialView;
      if (!view) return;
      map.jumpTo({
        center: view.center || map.getCenter(),
        zoom: typeof view.zoom === 'number' ? view.zoom : map.getZoom(),
      });
      if (typeof view.minZoom === 'number') map.setMinZoom(view.minZoom);
      if (typeof view.maxZoom === 'number') map.setMaxZoom(view.maxZoom);
    }

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    // Fit the map to a country's incident data, auto-derived from lat/long spread.
    // Falls back silently (no-op) if a country has no geocoded rows.
    function flyToCountryBounds(countryCode, opts) {
      opts = opts || {};
      var rows = allIncidents.filter(function(row) { return row['Country'] === countryCode; });
      if (rows.length === 0) return;

      var bounds = new maplibregl.LngLatBounds();
      rows.forEach(function(row) {
        var lat = parseFloat(row['Latitude']);
        var lng = parseFloat(row['Longitude']);
        if (!isNaN(lat) && !isNaN(lng)) bounds.extend([lng, lat]);
      });

      if (bounds.isEmpty()) return;

      map.fitBounds(bounds, {
        padding: 40,
        duration: opts.animate === false ? 0 : 1000,
        maxZoom: 10,
      });
    }

    // GLOBAL STATE
    let incidents = [];       // currently-active-country rows (drives map/table/filters/charts, unchanged downstream)
    let allIncidents = [];    // combined rows from every loaded country, tagged with row['Country']
    let activeCountry = 'PHL'; // default country on load; will be driven by nav in a later step
    let sortCol = 'Date';
    let sortAsc = true;
    let activeRowId = null;
    let activePopup = null;

    // Fallback data-source list, used only if schema.json fails to load or
    // declares no dataSource.files. COUNTRY_SOURCES itself (used throughout
    // the file below) is now derived from schema.dataSource.files once the
    // schema loads — see the init flow further down.
    var DATA_SOURCES_FALLBACK = [
      { code: 'PHL', file: 'PHLdata.csv', label: 'Philippines' },
      { code: 'THA', file: 'THAdata.csv', label: 'Thailand' },
    ];
    var COUNTRY_SOURCES = DATA_SOURCES_FALLBACK;

    function fetchAndParseCSV(file) {
      return fetch(file)
        .then(function(response) {
          console.log('Fetch status:', file, response.status, response.statusText);
          return response.text();
        })
        .then(function(text) {
          var results = Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            encoding: 'UTF-8',
          });
          console.log('Raw rows from', file, ':', results.data.length);
          return results.data;
        });
    }

    // ── SCHEMA / VOCAB LOADER ──────────────────────────────────────
    // Loads schema.json plus any vocab files it references (e.g. Actor Type,
    // Convergence controlled vocabularies). This step ONLY proves the loader
    // works — SCHEMA is populated and logged, but nothing downstream reads
    // from it yet. All existing hardcoded rendering logic below is untouched.
    // A later step replaces those hardcoded pieces with reads from SCHEMA.
    var SCHEMA = null;

    function loadSchema() {
      return fetch('schema.json')
        .then(function(response) {
          if (!response.ok) throw new Error('schema.json fetch failed: ' + response.status);
          return response.json();
        })
        .then(function(schema) {
          // Collect every distinct vocab file path referenced anywhere in the schema
          var vocabPaths = new Set();
          (schema.columns || []).forEach(function(col) {
            if (col.vocab) vocabPaths.add(col.vocab);
          });
          if (schema.filters && schema.filters.multiSelect) {
            schema.filters.multiSelect.forEach(function(f) {
              if (f.vocab) vocabPaths.add(f.vocab);
            });
          }

          schema.vocabs = {}; // resolved: vocab file path -> array of values

          return Promise.all(
            Array.from(vocabPaths).map(function(path) {
              return fetch(path)
                .then(function(r) {
                  if (!r.ok) throw new Error('vocab fetch failed: ' + path + ' (' + r.status + ')');
                  return r.json();
                })
                .then(function(vocabJson) {
                  schema.vocabs[path] = vocabJson.values || [];
                })
                .catch(function(err) {
                  console.error('Vocab load error:', path, err);
                  schema.vocabs[path] = []; // fail soft — empty vocab, not a crash
                });
            })
          ).then(function() {
            return schema;
          });
        });
    }

    // Fallback used only if schema.json/vocab files fail to load — the exact
    // same 14-category list that used to be hardcoded (in two places) in
    // buildFilters() and switchCountry(). getActorTypeVocab() below looks up
    // the live vocab file via the column definition rather than a hardcoded
    // path, so this fallback is the only place the list is spelled out now.
    var ACTOR_TYPE_FALLBACK = [
      'NSAG','Police','Military','Other State Agency','State Auxiliary',
      'Political Affiliate','Gang','Civilian Official',
      'Communal/Political Militia','Criminal Organization','Criminal Individual',
      'Civilian Community','Unknown/Unaffiliated Entity','Former police/soldier',
    ];

    function getActorTypeVocab() {
      return getVocabForColumn('Actor Type') || ACTOR_TYPE_FALLBACK;
    }

    // ── GENERIC CATEGORICAL-POINTS LAYER FACTORY ──────────────────────
    // Produces a schema-driven layer: points colored by a category column,
    // with a toggleable legend, filtering, and a dimmed cross-country
    // background layer. The Incidents layer and the Crime Convergence layer
    // are now both instances of this one factory — this replaces what used
    // to be two hand-written, near-duplicate ~150-line blocks of code.
    function createCategoricalLayer(cfg) {
      var sourceId    = cfg.id;
      var bgSourceId  = cfg.id + '-bg';
      var circlesId   = cfg.id + '-circles';
      var haloId      = cfg.id + '-halo';
      var bgCirclesId = cfg.id + '-bg-circles';

      var colorMap     = cfg.colorMap || {};
      var vocabKeys    = Object.keys(colorMap);
      var defaultColor = cfg.defaultColor || '#8b949e';

      var layerAdded = false;
      var hoverPopup = null;
      var categoryColors = {}; // legend's actual category -> color map
      var activeCategories = cfg.legendSource === 'vocab' ? new Set(vocabKeys) : new Set();

      function matchCategory(val) {
        if (!val) return null;
        var v = val.trim().toLowerCase();
        for (var i = 0; i < vocabKeys.length; i++) {
          var k = vocabKeys[i].toLowerCase();
          var hit = cfg.matchMode === 'startsWith' ? v.startsWith(k) : v.includes(k);
          if (hit) return vocabKeys[i];
        }
        return null;
      }

      function colorFor(val) {
        var cat = matchCategory(val);
        return cat ? colorMap[cat] : defaultColor;
      }

      // Multi-value fields (e.g. Convergence): split on common delimiters,
      // use the color of the first segment that matches a known category.
      function primaryColorFor(field) {
        if (!field) return defaultColor;
        var parts = field.split(/[,;\n\r]+/);
        for (var i = 0; i < parts.length; i++) {
          var col = colorFor(parts[i].trim());
          if (col !== defaultColor) return col;
        }
        return defaultColor;
      }

      function toGeoJSON(rows) {
        var src = cfg.multiValue
          ? rows.filter(function(row) { return row[cfg.column] && row[cfg.column].trim(); })
          : rows;
        return {
          type: 'FeatureCollection',
          features: src.map(function(row, i) {
            var raw = (row[cfg.column] || '').trim();
            var label = cfg.multiValue
              ? raw.split(/[,;\n\r]+/).map(function(s){ return s.trim(); }).filter(Boolean).join(', ')
              : raw;
            var color = cfg.multiValue ? primaryColorFor(raw) : colorFor(raw);
            return {
              type: 'Feature',
              id: i,
              geometry: {
                type: 'Point',
                coordinates: [parseFloat(row['Longitude']), parseFloat(row['Latitude'])]
              },
              properties: {
                id: i,
                category: raw,
                category_label: label,
                color: color,
                date: row['Date'] || '',
                title: row['Title'] || '',
                location: row['Location'] || '',
                incident_type: row['Incident Type'] || '',
                // Reads whatever column the schema's weighted-heatmap layer
                // points at (set by buildMapLayers), falling back to 'Arms
                // Score' only if no heatmap layer/column has been resolved
                // yet — this used to be hardcoded to 'Arms Score' literally,
                // which silently broke any client whose score column had a
                // different name (e.g. 'Severity Score').
                score: row[heatmapColumnName || 'Arms Score'] || '',
                convergence: row['Convergence'] || '',
                country: row['Country'] || '',
              }
            };
          })
        };
      }

      function add(activeRows, allRows) {
        if (layerAdded) return;

        if (allRows && allRows.length) {
          map.addSource(bgSourceId, { type: 'geojson', data: toGeoJSON(allRows) });
          map.addLayer({
            id: bgCirclesId,
            type: 'circle',
            source: bgSourceId,
            filter: ['!=', ['get', 'country'], activeCountry],
            layout: cfg.startHidden ? { visibility: 'none' } : {},
            paint: {
              'circle-radius': ['interpolate', ['linear'], ['zoom'], 5, 4, 10, 7],
              'circle-color': ['get', 'color'],
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff',
              'circle-opacity': 0.18,
              'circle-stroke-opacity': 0.18,
            }
          });
        }

        map.addSource(sourceId, { type: 'geojson', data: toGeoJSON(activeRows) });

        map.addLayer({
          id: haloId, type: 'circle', source: sourceId,
          layout: cfg.startHidden ? { visibility: 'none' } : {},
          paint: { 'circle-radius': 14, 'circle-color': ['get', 'color'], 'circle-opacity': 0, 'circle-blur': 0.6 }
        });

        map.addLayer({
          id: circlesId, type: 'circle', source: sourceId,
          layout: cfg.startHidden ? { visibility: 'none' } : {},
          paint: {
            'circle-radius': ['interpolate', ['linear'], ['zoom'], 5, 5, 10, 9],
            'circle-color': ['get', 'color'],
            'circle-stroke-width': 1.5,
            'circle-stroke-color': '#fff',
            'circle-opacity': 0.88,
          }
        });

        if (cfg.interaction === 'hover-flyto') {
          map.on('mouseenter', circlesId, function(e) {
            map.getCanvas().style.cursor = 'pointer';
            var props = e.features[0].properties;
            var coords = e.features[0].geometry.coordinates.slice();
            if (hoverPopup) hoverPopup.remove();
            hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, maxWidth: '260px', offset: 10 })
              .setLngLat(coords)
              .setHTML(cfg.popupBuilder(props, 'hover'))
              .addTo(map);
          });
          map.on('mouseleave', circlesId, function() {
            map.getCanvas().style.cursor = '';
            if (hoverPopup) { hoverPopup.remove(); hoverPopup = null; }
          });
          map.on('click', circlesId, function(e) {
            var props = e.features[0].properties;
            var coords = e.features[0].geometry.coordinates.slice();
            if (hoverPopup) { hoverPopup.remove(); hoverPopup = null; }
            if (activePopup) activePopup.remove();
            map.flyTo({ center: coords, zoom: 10, speed: 1.2 });
            activePopup = new maplibregl.Popup({ maxWidth: '280px', offset: 12 })
              .setLngLat(coords)
              .setHTML(cfg.popupBuilder(props, 'click'))
              .addTo(map);
          });
        } else {
          map.on('click', circlesId, function(e) {
            var props = e.features[0].properties;
            var rowId = props.id;
            if (activePopup) activePopup.remove();
            activePopup = new maplibregl.Popup({ maxWidth: '280px', offset: 12 })
              .setLngLat(e.features[0].geometry.coordinates)
              .setHTML(cfg.popupBuilder(props, 'click'))
              .addTo(map);
            highlightRow(rowId);
          });
          map.on('mouseenter', circlesId, function() { map.getCanvas().style.cursor = 'pointer'; });
          map.on('mouseleave', circlesId, function() { map.getCanvas().style.cursor = ''; });
        }

        layerAdded = true;
      }

      function buildLegend(rows) {
        if (cfg.legendSource === 'vocab') {
          categoryColors = {};
          vocabKeys.forEach(function(k) { categoryColors[k] = colorMap[k]; });
        } else {
          categoryColors = {};
          (rows || []).forEach(function(row) {
            var t = (row[cfg.column] || 'Unknown').trim();
            if (!categoryColors[t]) categoryColors[t] = colorFor(t);
          });
        }
        if (activeCategories.size === 0) {
          activeCategories = new Set(Object.keys(categoryColors));
        }
        renderLegend();
      }

      function renderLegend() {
        var allActive = activeCategories.size === Object.keys(categoryColors).length;
        var html = '<div class="legend-title">' + escHtml(cfg.legendTitle) + '</div>';
        Object.entries(categoryColors).sort(function(a,b){ return a[0].localeCompare(b[0]); }).forEach(function(entry) {
          var cat = entry[0], color = entry[1];
          var active = activeCategories.has(cat);
          html += '<div class="legend-row cat-legend-row" data-cat="' + escHtml(cat) + '" style="cursor:pointer;" title="Click to toggle">' +
            '<span class="legend-swatch" style="background:' + (active ? color : 'transparent') + ';border:2px solid ' + color + ';box-sizing:border-box;transition:background .15s;"></span>' +
            '<span class="legend-label" style="opacity:' + (active ? '1' : '0.4') + ';transition:opacity .15s;">' + escHtml(cat) + '</span>' +
            '</div>';
        });
        if (!allActive) {
          html += '<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border);">' +
            '<span class="cat-reset-filter" style="font-family:var(--font-ui);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);cursor:pointer;">Show all</span>' +
            '</div>';
        }

        var legend = document.getElementById('mapLegend');
        legend.innerHTML = html;

        legend.querySelectorAll('.cat-legend-row').forEach(function(row) {
          row.addEventListener('click', function() {
            var cat = row.dataset.cat;
            if (activeCategories.has(cat)) {
              if (activeCategories.size > 1) activeCategories.delete(cat);
            } else {
              activeCategories.add(cat);
            }
            renderLegend();
            applyFilter();
          });
        });

        var resetEl = legend.querySelector('.cat-reset-filter');
        if (resetEl) {
          resetEl.addEventListener('click', function() {
            activeCategories = new Set(Object.keys(categoryColors));
            renderLegend();
            applyFilter();
          });
        }
      }

      function applyFilter() {
        if (!layerAdded) return;
        var totalCount = Object.keys(categoryColors).length;
        var activeColors = Array.from(activeCategories).map(function(c) { return categoryColors[c]; });
        var filterExpr = activeColors.length === totalCount ? null : ['in', ['get', 'color'], ['literal', activeColors]];
        [circlesId, haloId].forEach(function(id) { if (map.getLayer(id)) map.setFilter(id, filterExpr); });

        if (map.getLayer(bgCirclesId)) {
          var countryFilterExpr = ['!=', ['get', 'country'], activeCountry];
          var combined = filterExpr ? ['all', countryFilterExpr, filterExpr] : countryFilterExpr;
          map.setFilter(bgCirclesId, combined);
        }
      }

      function update(rows) {
        if (!layerAdded) return;
        map.getSource(sourceId).setData(toGeoJSON(rows));
      }

      function setVisible(visible) {
        [circlesId, haloId, bgCirclesId].forEach(function(id) {
          if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
        });
      }

      function clearHoverPopup() {
        if (hoverPopup) { hoverPopup.remove(); hoverPopup = null; }
      }

      function clearActive() { activeCategories = new Set(); }
      function showAll() { activeCategories = new Set(Object.keys(categoryColors)); }
      function resetToFullVocab() { activeCategories = new Set(vocabKeys); }

      return {
        add: add,
        buildLegend: buildLegend,
        applyFilter: applyFilter,
        update: update,
        setVisible: setVisible,
        clearHoverPopup: clearHoverPopup,
        clearActive: clearActive,
        showAll: showAll,
        resetToFullVocab: resetToFullVocab,
        colorFor: colorFor,   // schema-driven color lookup, for reuse outside the map (table badges, chart colors)
        column: cfg.column,   // which CSV column this layer colors by
        get layerAdded() { return layerAdded; },
        ids: { source: sourceId, bgSource: bgSourceId, circles: circlesId, halo: haloId, bgCircles: bgCirclesId }
      };
    }

    // Popup templates — kept as code, not schema.json, since exact layout and
    // behavior (hover vs. click, colored header, field order) is presentation
    // detail. Ported verbatim from the previous hand-written popups.
    function incidentsPopupHtml(props) {
      return '<strong>' + props.category + '</strong>' +
        '<div class="popup-title">' + props.title + '</div>' +
        '<div class="popup-meta">' +
        '<span>Date: ' + props.date + '</span>' +
        (props.location ? '<span>' + props.location + '</span>' : '') +
        (props.score ? '<span>Score: ' + parseFloat(props.score).toFixed(1) + '</span>' : '') +
        (props.convergence ? '<span>Convergence: ' + props.convergence + '</span>' : '') +
        '</div>';
    }

    function convergencePopupHtml(props, mode) {
      var meta = mode === 'click'
        ? '<span>' + escHtml(props.incident_type) + ' · ' + escHtml(props.date) + '</span>'
        : '<span>' + escHtml(props.date) + '</span>';
      return '<strong style="color:' + props.color + '">' + escHtml(props.category_label) + '</strong>' +
        '<div class="popup-title">' + escHtml(props.title) + '</div>' +
        '<div class="popup-meta">' + meta +
        (props.location ? '<span>' + escHtml(props.location) + '</span>' : '') +
        '</div>';
    }

    // Fallback popup for any categorical-points layer beyond the two SEA has
    // hand-styled templates for. Generic enough to be reasonable for most
    // category-by-column layers (colored header, title, date, location) —
    // see POPUP_BUILDERS below for how a client-specific layer can override it.
    function genericCategoricalPopupHtml(props) {
      return '<strong style="color:' + props.color + '">' + escHtml(props.category_label || props.category) + '</strong>' +
        '<div class="popup-title">' + escHtml(props.title) + '</div>' +
        '<div class="popup-meta">' +
        '<span>' + escHtml(props.date) + '</span>' +
        (props.location ? '<span>' + escHtml(props.location) + '</span>' : '') +
        '</div>';
    }

    var POPUP_BUILDERS = {
      'incidents': incidentsPopupHtml,
      'crime-convergence': convergencePopupHtml,
    };

    // Fallback config used only if schema.json fails to load, reconstructed
    // from the legacy hardcoded constants so the dashboard still works.
    function buildFallbackSchema() {
      return {
        layers: [
          { type: 'categorical-points', id: 'incidents', label: 'Incidents', column: 'Incident Type', colorMap: TYPE_COLORS, defaultColor: DEFAULT_COLOR },
          { type: 'categorical-points', id: 'crime-convergence', label: 'Crime Convergence', column: 'Convergence', colorMap: CONVERGENCE_COLORS, defaultColor: CONVERGENCE_DEFAULT },
          { type: 'weighted-heatmap', id: 'arms-score', label: 'Arms Score', column: 'Arms Score', maxWeight: 50, legendCaption: 'Weighted by Arms Score per incident' }
        ],
        vocabs: {}
      };
    }

    // ── GENERIC WEIGHTED-HEATMAP LAYER FACTORY ─────────────────────────
    // A heatmap weighted by a numeric column (Arms Score for SEA). It reuses
    // an existing categorical-points layer's map source rather than creating
    // its own — that source's GeoJSON already carries a 'score' property
    // (populated from whichever column that layer's schema entry points at,
    // conventionally the same numeric field this heatmap weights by), so no
    // separate data fetch or source is needed. A client schema with no
    // numeric score column simply omits a weighted-heatmap layer entirely —
    // buildMapLayers() below only creates this instance if one is declared.
    function createWeightedHeatmapLayer(cfg) {
      var heatmapId   = cfg.id + '-heatmap';
      var heatmapBgId = cfg.id + '-heatmap-bg';
      var added = false;

      function paintFor(opacity) {
        return {
          'heatmap-weight': ['interpolate', ['linear'], ['to-number', ['get', 'score'], 0], 0, 0, cfg.maxWeight, 1],
          'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 4, 0.6, 10, 2.5],
          'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 4, 18, 10, 40],
          'heatmap-color': [
            'interpolate', ['linear'], ['heatmap-density'],
            0,    'rgba(26,26,46,0)',
            0.15, '#3b1054',
            0.35, '#6b2d8b',
            0.55, '#b5367a',
            0.70, '#e8602c',
            0.85, '#f5a623',
            1.0,  '#fef200'
          ],
          'heatmap-opacity': opacity,
        };
      }

      function add() {
        if (added) return;
        var srcIds = cfg.sourceLayer.ids;
        if (!map.getSource(srcIds.source)) return;

        if (map.getSource(srcIds.bgSource)) {
          map.addLayer({
            id: heatmapBgId,
            type: 'heatmap',
            source: srcIds.bgSource,
            filter: ['!=', ['get', 'country'], activeCountry],
            layout: { visibility: 'none' },
            paint: paintFor(0.22), // dimmed — context only, not the focus
          }, srcIds.halo); // insert below incident points, same as the active heatmap
        }

        map.addLayer({
          id: heatmapId,
          type: 'heatmap',
          source: srcIds.source,
          layout: { visibility: 'none' },
          paint: paintFor(0.85),
        }, srcIds.halo);

        added = true;
      }

      function renderLegend() {
        var HEAT_BREAKS = ['#3b1054', '#6b2d8b', '#b5367a', '#e8602c', '#f5a623', '#fef200'];
        var gradientStops = HEAT_BREAKS.join(', ');
        var legend = document.getElementById('mapLegend');
        legend.innerHTML =
          '<div class="legend-title">' + escHtml(cfg.legendTitle) + '</div>' +
          '<div style="height:10px;border-radius:4px;background:linear-gradient(to right,' + gradientStops + ');margin:6px 0 4px;"></div>' +
          '<div style="display:flex;justify-content:space-between;font-size:10px;color:#8b949e;">' +
          '<span>Low</span><span>High</span></div>' +
          '<div style="font-size:10px;color:#484f58;margin-top:6px;">' + escHtml(cfg.legendCaption) + '</div>';
      }

      function show() {
        if (!added) return;
        map.setLayoutProperty(heatmapId, 'visibility', 'visible');
        if (map.getLayer(heatmapBgId)) {
          map.setLayoutProperty(heatmapBgId, 'visibility', 'visible');
          map.setFilter(heatmapBgId, ['!=', ['get', 'country'], activeCountry]);
        }
      }

      function activate() {
        cfg.sourceLayer.setVisible(false);
        add();
        show();
        renderLegend();
      }

      function deactivate() {
        cfg.sourceLayer.setVisible(true);
        if (map.getLayer(heatmapId)) map.setLayoutProperty(heatmapId, 'visibility', 'none');
        if (map.getLayer(heatmapBgId)) map.setLayoutProperty(heatmapBgId, 'visibility', 'none');
      }

      // update() ignores its argument: the heatmap reads the same source the
      // categorical layer already refreshed via its own update(rows) call in
      // applyFilters() — this just re-asserts visibility/filter state.
      function update() { show(); }

      return { activate: activate, deactivate: deactivate, update: update };
    }

    var incidentsLayer, convergenceLayer, armsHeatmapLayer;
    var categoricalLayers = {};    // every categorical-points layer, keyed by schema id
    var baseCategoricalLayerId;    // the first categorical-points layer — everything else overlays it
    var heatmapLayerId;            // the weighted-heatmap layer's id, if the schema declares one
    var heatmapColumnName;         // the CSV column it weights by (e.g. 'Arms Score', 'Severity Score') — read by createCategoricalLayer's toGeoJSON below

    // layerControllers maps a schema layer's id -> { activate, deactivate }.
    // buildLayerNav()'s tab-click handler dispatches through this registry
    // instead of hardcoded id checks, so adding a layer in schema.json is
    // enough to wire up its tab — no JS changes needed for a new instance of
    // a layer type that's already supported.
    var layerControllers = {};

    // Any categorical-points layer beyond the first ("incidents", the base
    // layer everything else overlays) follows this same activate/deactivate
    // pattern — this generalizes what used to be Crime-Convergence-specific
    // code (activateConvergenceTab/deactivateConvergenceTab) so a future
    // second or third overlay layer (e.g. Venue Type, Target Type) can reuse
    // it directly rather than needing its own hand-written copy.
    function activateOverlayCategoricalLayer(layer, baseLayer) {
      baseLayer.setVisible(false);
      layer.add(currentFilteredRows, allIncidents);
      layer.update(currentFilteredRows);
      layer.setVisible(true);
      layer.buildLegend(currentFilteredRows);
      layer.applyFilter();
    }

    function deactivateOverlayCategoricalLayer(layer, baseLayer) {
      layer.setVisible(false);
      baseLayer.setVisible(true);
      layer.clearHoverPopup();
      layer.showAll();
    }

    function buildMapLayers(schema) {
      var catDefs = (schema.layers || []).filter(function(l) { return l.type === 'categorical-points'; });
      if (!catDefs.length) {
        // Fallback matches SEA's original two hardcoded layers exactly.
        catDefs = [
          { id: 'incidents', column: 'Incident Type', colorMap: TYPE_COLORS, defaultColor: DEFAULT_COLOR },
          { id: 'crime-convergence', column: 'Convergence', colorMap: CONVERGENCE_COLORS, defaultColor: CONVERGENCE_DEFAULT,
            matchMode: 'startsWith', multiValue: true, legendSource: 'vocab', interaction: 'hover-flyto' },
        ];
      }

      // The first categorical-points layer in schema.layers is the base —
      // conventionally 'incidents' — and every layer after it is an overlay
      // that swaps in over the base (this is what used to be exactly-two
      // hand-wired layers; now it's genuinely N). Defaults below match each
      // layer's role unless the schema entry overrides them explicitly.
      categoricalLayers = {};
      baseCategoricalLayerId = catDefs[0].id;

      catDefs.forEach(function(def, i) {
        var isBase = i === 0;
        var instance = createCategoricalLayer({
          id: def.id,
          column: def.column,
          colorMap: def.colorMap,
          defaultColor: def.defaultColor || (isBase ? DEFAULT_COLOR : CONVERGENCE_DEFAULT),
          matchMode: def.matchMode || (isBase ? 'includes' : 'startsWith'),
          multiValue: def.multiValue != null ? def.multiValue : !isBase,
          legendSource: def.legendSource || (isBase ? 'data' : 'vocab'),
          legendTitle: def.label || def.column,
          interaction: def.interaction || (isBase ? 'click' : 'hover-flyto'),
          startHidden: !isBase,
          popupBuilder: POPUP_BUILDERS[def.id] || genericCategoricalPopupHtml,
        });
        categoricalLayers[def.id] = instance;
      });

      incidentsLayer = categoricalLayers[baseCategoricalLayerId]; // kept as an alias — many existing call sites below reference "the base layer" by this name
      convergenceLayer = categoricalLayers['crime-convergence'];  // kept for SEA-specific call sites (applyFilters' active-tab check); undefined for a schema with no such layer, which is fine since nothing reaches those call sites without that tab existing

      // Weighted-heatmap is optional — a client schema with no numeric score
      // column simply omits this layer type, and armsHeatmapLayer stays
      // undefined; it's just never added to layerControllers below.
      var heatmapDef = (schema.layers || []).filter(function(l) { return l.type === 'weighted-heatmap'; })[0];
      heatmapLayerId = heatmapDef && (heatmapDef.id || 'arms-score');
      heatmapColumnName = heatmapDef && heatmapDef.column;
      if (heatmapDef) {
        armsHeatmapLayer = createWeightedHeatmapLayer({
          id: heatmapLayerId,
          maxWeight: heatmapDef.maxWeight || 50,
          legendTitle: (heatmapDef.label || 'Arms Score') + ' Intensity',
          legendCaption: heatmapDef.legendCaption || ('Weighted by ' + (heatmapDef.column || 'score') + ' per incident'),
          sourceLayer: incidentsLayer,
        });
      }

      // Wire the controller registry. 'metrics' is intentionally absent —
      // it swaps the whole panel (map <-> charts) rather than toggling a map
      // layer, so it's handled as its own case in buildLayerNav() below.
      layerControllers = {};
      layerControllers[baseCategoricalLayerId] = {
        activate: function() { buildLegend(); applyIncidentTypeFilter(); },
        deactivate: function() { incidentsLayer.showAll(); applyIncidentTypeFilter(); },
      };
      catDefs.slice(1).forEach(function(def) {
        var layer = categoricalLayers[def.id];
        layerControllers[def.id] = {
          activate: function() { activateOverlayCategoricalLayer(layer, incidentsLayer); },
          deactivate: function() { deactivateOverlayCategoricalLayer(layer, incidentsLayer); },
        };
      });
      if (heatmapDef && armsHeatmapLayer) {
        layerControllers[heatmapLayerId] = {
          activate: function() { armsHeatmapLayer.activate(); },
          deactivate: function() { armsHeatmapLayer.deactivate(); },
        };
      }
    }

    // Generates the tab strip from schema.layers (in array order) and wires
    // its click handling through layerControllers, so a layer added to or
    // removed from schema.json changes the tabs with no JS edits needed.
    function buildLayerNav(schema) {
      var nav = document.getElementById('layerSwitcher');
      var defs = schema.layers || [];

      nav.innerHTML = defs.map(function(def, i) {
        var extraClass = i === 0 ? ' active' : '';
        var checked = i === 0 ? ' checked' : '';
        return '<label class="layer-btn' + extraClass + '" data-layer="' + escHtml(def.id) + '">' +
          '<input type="radio" name="layer" value="' + escHtml(def.id) + '"' + checked + ' /> ' + escHtml(def.label || def.id) +
          '</label>';
      }).join('');

      nav.querySelectorAll('.layer-btn input').forEach(function(radio) {
        radio.addEventListener('change', function(e) {
          nav.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.remove('active'); });
          e.target.closest('.layer-btn').classList.add('active');
          var val = e.target.value;
          var metricsPanel = document.getElementById('metricsPanel');
          var mapEl = document.getElementById('map');
          var legend = document.getElementById('mapLegend');

          // Deactivate every other registered layer, regardless of which was
          // previously active — each deactivate() is safe to call even if
          // that layer was never activated (matches the original behavior).
          Object.keys(layerControllers).forEach(function(id) {
            if (id !== val) layerControllers[id].deactivate();
          });

          if (val === 'metrics') {
            metricsPanel.style.display = 'block';
            mapEl.style.display = 'none';
            if (legend) legend.style.display = 'none';
            renderMetrics(currentFilteredRows);
          } else {
            metricsPanel.style.display = 'none';
            mapEl.style.display = 'block';
            if (legend) legend.style.display = '';
            if (window.map) map.resize();
            if (layerControllers[val]) layerControllers[val].activate();
          }
        });
      });
    }

    // Schema loads first — everything else (which CSV files to fetch, map
    // layers, table, tabs) depends on it. This is a real sequencing change
    // from earlier pieces, which fetched SEA's two hardcoded CSVs in
    // parallel with the schema load; that worked only because the file list
    // was hardcoded and never actually depended on schema.json.
    loadSchema().catch(function(err) {
      console.error('Schema load error — falling back to built-in legacy config:', err);
      return buildFallbackSchema();
    }).then(function(schema) {
      SCHEMA = schema;
      console.log('Loaded schema.json:', SCHEMA);
      console.log('Loaded vocabs:', SCHEMA.vocabs);

      // Derive COUNTRY_SOURCES from schema.dataSource.files. A single-entry
      // list (the common case for a non-SEA client) means no country/region
      // split — renderCountryNav() hides itself accordingly.
      var files = (schema.dataSource && schema.dataSource.files && schema.dataSource.files.length)
        ? schema.dataSource.files
        : DATA_SOURCES_FALLBACK.map(function(s) { return { id: s.code, path: s.file, label: s.label }; });
      COUNTRY_SOURCES = files.map(function(f) { return { code: f.id, file: f.path, label: f.label }; });
      activeCountry = COUNTRY_SOURCES[0].code;

      applyMapViewFromSchema(schema);
      buildMapLayers(schema);
      buildLayerNav(schema); // generate the tab strip from schema.layers
      buildMetricsPanel(schema); // generate metrics sections/cards/canvases from schema.layers
      buildTableHead(); // generate <thead> from schema.table.columns before first render

      // STEP 5: LOAD & PARSE EVERY DECLARED DATA SOURCE
      return Promise.all(
        COUNTRY_SOURCES.map(function(src) {
          return fetchAndParseCSV(src.file).then(function(rows) {
            rows.forEach(function(row) {
              row['Country'] = src.code; // tag every row with its source code
            });
            return rows;
          }).catch(function(err) {
            console.error('Fetch error for', src.file, err);
            return []; // fail soft — one missing source shouldn't break the others
          });
        })
      );
    }).then(function(rowsByCountry) {
      var combined = [].concat.apply([], rowsByCountry);

      allIncidents = combined.filter(function(row) {
        return row['Latitude'] && row['Longitude'] &&
          !isNaN(parseFloat(row['Latitude'])) &&
          !isNaN(parseFloat(row['Longitude']));
      });
      console.log('Loaded allIncidents (all sources):', allIncidents.length);

      incidents = allIncidents.filter(function(row) {
        return row['Country'] === activeCountry;
      });
      console.log('Loaded incidents (active source: ' + activeCountry + '):', incidents.length);
      currentFilteredRows = incidents;

      function initialFitAndAddLayer() {
        flyToCountryBounds(activeCountry, { animate: false });
        addIncidentLayer();
      }

      if (map.loaded()) {
        initialFitAndAddLayer();
      } else {
        map.on('load', initialFitAndAddLayer);
      }

      setupStaticFilterControls(); // one-time: date/search listeners, reset button, click-outside-closes-panel
      buildFilterControls(); // build the multi-select dropdowns from schema.filters.multiSelect
      // applyFilters() and buildLegend() called inside addIncidentLayer() once map is ready
      renderTable(incidents); // populate table immediately while map loads

      renderCountryNav();
    }).catch(function(err) {
      console.error('Fetch error:', err);
      document.getElementById('tableBody').innerHTML =
        '<tr class="placeholder-row"><td colspan="99">Error loading incident data.</td></tr>';
    });

    // COUNTRY NAV
    function renderCountryNav() {
      var nav = document.getElementById('countryNav');
      // A single-source client (no country/region split) has nothing to
      // switch between — hide the nav rather than show one inert button.
      if (COUNTRY_SOURCES.length <= 1) { nav.style.display = 'none'; nav.innerHTML = ''; return; }
      nav.style.display = '';
      nav.innerHTML = '';
      COUNTRY_SOURCES.forEach(function(src) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'country-nav-item' + (src.code === activeCountry ? ' active' : '');
        btn.textContent = src.label;
        btn.addEventListener('click', function() {
          if (src.code === activeCountry) return; // already active, nothing to do
          switchCountry(src.code);
        });
        nav.appendChild(btn);
      });
    }

    function switchCountry(countryCode) {
      activeCountry = countryCode;

      incidents = allIncidents.filter(function(row) {
        return row['Country'] === activeCountry;
      });
      currentFilteredRows = incidents;
      console.log('Switched to country: ' + activeCountry + ', incidents:', incidents.length);

      flyToCountryBounds(activeCountry);

      // Reset filter state — Thailand's filter option set differs from Philippines'
      document.getElementById('filterDateFrom').value = '';
      document.getElementById('filterDateTo').value = '';
      document.getElementById('filterSearch').value = '';

      // Rebuilds the multi-select dropdowns (fresh msState + fresh option
      // lists) for whatever filters this schema declares.
      buildFilterControls();

      // Reset incident-type legend so it re-derives from the new country's types
      incidentsLayer.clearActive();
      buildLegend();   // rebuilds legend + re-activates all types for this country
      applyFilters();  // re-filters incidents, updates map source, table, metrics, heatmap/convergence

      // Flip which country is dimmed vs. active in the background context layers.
      // Must run AFTER buildLegend() so the legend/active-set already reflect
      // the new country, not the one we just switched away from. Every call
      // is internally guarded (no-op if that layer hasn't been added yet) —
      // loop covers however many categorical-points layers this schema has.
      Object.keys(categoricalLayers).forEach(function(id) { categoricalLayers[id].applyFilter(); });

      renderCountryNav(); // re-render nav so the active pill updates
    }

    // STEP 6: ADD POINT LAYER
    // toGeoJSON, source/layer creation, and click/hover handlers now all live
    // inside incidentsLayer (a createCategoricalLayer instance built in
    // buildMapLayers() once schema.json has loaded — see above).
    function addIncidentLayer() {
      incidentsLayer.add(incidents, allIncidents);
      console.log('Incident layer added');
      buildLegend();
      applyFilters();
    }


    // FILTERS
    function normaliseTag(t) {
      return t.trim().toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); });
    }

    function getColumnDef(name) {
      return SCHEMA && (SCHEMA.columns || []).filter(function(c) { return c.name === name; })[0];
    }

    // Splits a raw cell value into parts if the column is declared
    // multi-text in schema.columns (using its own delimiter), otherwise
    // returns the whole value as a single-item array. Generalizes what used
    // to be two separate hardcoded splits (Tags on /[\n,]/, Actor Type on \n).
    function splitMultiValue(column, raw) {
      var colDef = getColumnDef(column);
      if (!colDef || colDef.type !== 'multi-text') return [raw];
      var delim = colDef.delimiter || ',';
      if (delim === '\n') return raw.split(/\n/);
      var escaped = delim.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return raw.split(new RegExp('[' + escaped + ']'));
    }

    // Per-column value normalizer, used both to build a data-derived
    // dropdown's option list and to test row matches against it. Default is
    // a plain trim; Tags keeps its original title-case cleanup so existing
    // tag matching/display doesn't change.
    var MULTISELECT_NORMALIZERS = { 'Tags': normaliseTag };
    function normalizeMultiSelectValue(column, v) {
      var fn = MULTISELECT_NORMALIZERS[column];
      return fn ? fn(v) : v.trim();
    }

    // Per-column post-filter on a data-derived dropdown's option list. Tags
    // keeps SEA's original cleanup (dedupe against Incident Type values,
    // drop 'Convergence: ...' fragments and stray close-parens) — this is
    // SEA-specific data hygiene, not a generic pattern, so any other column
    // just gets a plain trim+dedupe+sort with no filtering.
    var MULTISELECT_DATA_FILTERS = {
      'Tags': function(values, rows) {
        var incidentTypes = new Set(rows.map(function(r){ return (r['Incident Type']||'').trim().toLowerCase(); }));
        ['illicit possession','illicit transfer','illicit manufacture'].forEach(function(t){ incidentTypes.add(t); });
        return values.filter(function(v) {
          var low = v.toLowerCase();
          if (incidentTypes.has(low)) return false;
          if (low.startsWith('convergence')) return false;
          if (v.endsWith(')') && !v.includes('(')) return false;
          return true;
        });
      },
    };

    function deriveDataOptions(column, rows) {
      var set = {};
      rows.forEach(function(row) {
        splitMultiValue(column, row[column] || '').forEach(function(part) {
          var n = normalizeMultiSelectValue(column, part);
          if (n) set[n] = true;
        });
      });
      var values = Object.keys(set);
      var filterFn = MULTISELECT_DATA_FILTERS[column];
      if (filterFn) values = filterFn(values, rows);
      return values.sort();
    }

    function defaultPlaceholder(column) {
      var lower = column.toLowerCase();
      return 'All ' + (lower.endsWith('s') ? lower : lower + 's');
    }

    function msContainerId(column) {
      return 'ms-' + column.replace(/[^a-zA-Z0-9]/g, '');
    }

    function multiSelectDefs() {
      return (SCHEMA && SCHEMA.filters && SCHEMA.filters.multiSelect && SCHEMA.filters.multiSelect.length)
        ? SCHEMA.filters.multiSelect
        : [
            { column: 'Incident Type', deriveFrom: 'data', label: 'Type' },
            { column: 'Tags', deriveFrom: 'data', label: 'Tag' },
            { column: 'Actor Type', deriveFrom: 'vocab', vocab: 'vocab/actor-type.json' },
          ];
    }

    // ── Multi-select state ────────────────────────────────────────────
    // Keyed by column name now (was a fixed {type,tag,actor} object) — one
    // entry per schema.filters.multiSelect definition, whatever those are.
    var msState = {};

    function buildMultiSelect(key, containerId, options, placeholder) {
      var wrap = document.getElementById(containerId);
      wrap.innerHTML = '';

      var btn = document.createElement('button');
      btn.className = 'filter-input filter-select ms-btn';
      btn.type = 'button';

      var panel = document.createElement('div');
      panel.className = 'ms-panel';
      panel.style.display = 'none';

      function updateBtn() {
        var sel = msState[key];
        if (sel.size === 0) {
          btn.textContent = placeholder;
          btn.classList.remove('ms-active');
        } else if (sel.size === 1) {
          var v = Array.from(sel)[0];
          btn.textContent = v.length > 18 ? v.slice(0,16) + '…' : v;
          btn.classList.add('ms-active');
        } else {
          btn.textContent = sel.size + ' selected';
          btn.classList.add('ms-active');
        }
      }

      function buildPanel() {
        panel.innerHTML = '';
        var allRow = document.createElement('div');
        allRow.className = 'ms-row ms-all-row';
        allRow.innerHTML = '<span class="ms-all-label">All / None</span>';
        allRow.addEventListener('click', function() {
          if (msState[key].size === options.length) {
            msState[key].clear();
          } else {
            options.forEach(function(o) { msState[key].add(o); });
          }
          buildPanel(); updateBtn(); applyFilters();
        });
        panel.appendChild(allRow);
        var divEl = document.createElement('div');
        divEl.className = 'ms-divider';
        panel.appendChild(divEl);

        options.forEach(function(opt) {
          var row = document.createElement('div');
          row.className = 'ms-row' + (msState[key].has(opt) ? ' ms-checked' : '');
          var check = document.createElement('span');
          check.className = 'ms-check';
          check.innerHTML = msState[key].has(opt)
            ? '<svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : '';
          var label = document.createElement('span');
          label.className = 'ms-option-label';
          label.textContent = opt;
          row.appendChild(check);
          row.appendChild(label);
          row.addEventListener('click', function(e) {
            e.stopPropagation();
            if (msState[key].has(opt)) { msState[key].delete(opt); } else { msState[key].add(opt); }
            buildPanel(); updateBtn(); applyFilters();
          });
          panel.appendChild(row);
        });
      }

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = panel.style.display !== 'none';
        document.querySelectorAll('.ms-panel').forEach(function(p) { p.style.display = 'none'; });
        if (!isOpen) { buildPanel(); panel.style.display = 'block'; }
      });

      wrap.appendChild(btn);
      wrap.appendChild(panel);
      updateBtn();
    }

    // Builds (or rebuilds) the multi-select filter dropdowns from
    // schema.filters.multiSelect — the HTML container, msState entries, and
    // each dropdown's option list. Called at init and whenever the
    // underlying data changes (switchCountry, filter reset).
    function buildFilterControls() {
      var wrap = document.getElementById('multiSelectFilters');
      var defs = multiSelectDefs();

      wrap.innerHTML = defs.map(function(entry) {
        var id = msContainerId(entry.column);
        var label = entry.label || entry.column;
        return '<div class="filter-group">' +
          '<label class="filter-label">' + escHtml(label) + '</label>' +
          '<div class="ms-wrap" id="' + id + '"></div>' +
          '</div>';
      }).join('');

      defs.forEach(function(entry) {
        msState[entry.column] = new Set();
        var options;
        if (entry.deriveFrom === 'vocab') {
          // getActorTypeVocab() carries its own hardcoded fallback list —
          // keep using it specifically for Actor Type so a schema/vocab load
          // failure still leaves that one dropdown populated. Any other
          // vocab-derived column just uses the generic lookup (empty list on
          // failure, same as every other schema-driven piece degrades).
          options = entry.column === 'Actor Type' ? getActorTypeVocab() : (getVocabForColumn(entry.column) || []);
        } else {
          options = deriveDataOptions(entry.column, incidents);
        }
        var placeholder = entry.placeholder || defaultPlaceholder(entry.column);
        buildMultiSelect(entry.column, msContainerId(entry.column), options, placeholder);
      });
    }

    // One-time wiring for the filter controls that don't get regenerated —
    // date inputs, search box, the click-outside-closes-panel handler, and
    // the reset button. Call once at init.
    function setupStaticFilterControls() {
      ['filterDateFrom','filterDateTo','filterSearch'].forEach(function(id){
        document.getElementById(id).addEventListener('input', applyFilters);
      });

      document.addEventListener('click', function() {
        document.querySelectorAll('.ms-panel').forEach(function(p) { p.style.display = 'none'; });
      });

      document.getElementById('filterReset').addEventListener('click', function(){
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('filterSearch').value = '';
        buildFilterControls();
        applyFilters();
      });
    }

    var MONTHS = {
      'January':'01','February':'02','March':'03','April':'04','May':'05','June':'06',
      'July':'07','August':'08','September':'09','October':'10','November':'11','December':'12'
    };

    function toISO(d) {
      // Parse 'DD Month YYYY' -> 'YYYY-MM-DD' for date filter comparisons
      if (!d) return '';
      var parts = d.trim().split(' ');
      if (parts.length === 3 && MONTHS[parts[1]]) {
        return parts[2] + '-' + MONTHS[parts[1]] + '-' + parts[0].padStart(2, '0');
      }
      // Fallback: M/D/YYYY or MM/DD/YYYY
      var slashParts = d.split('/');
      if (slashParts.length === 3) {
        return slashParts[2] + '-' + slashParts[0].padStart(2,'0') + '-' + slashParts[1].padStart(2,'0');
      }
      return d;
    }

    function applyFilters() {
      var dateFrom  = document.getElementById('filterDateFrom').value;
      var dateTo    = document.getElementById('filterDateTo').value;
      var dateColumn = (SCHEMA && SCHEMA.filters && SCHEMA.filters.dateColumn) || 'Date';
      var searchFields = (SCHEMA && SCHEMA.filters && SCHEMA.filters.search && SCHEMA.filters.search.length)
        ? SCHEMA.filters.search
        : ['Title', 'Location', 'Incident Type', 'Tags', 'Description', 'Actors', 'Weapons'];
      var defs = multiSelectDefs();
      var search = document.getElementById('filterSearch').value.toLowerCase().trim();

      var filtered = incidents.filter(function(row) {
        var d = toISO(row[dateColumn] || '');
        if (dateFrom && d < dateFrom) return false;
        if (dateTo   && d > dateTo)   return false;

        for (var i = 0; i < defs.length; i++) {
          var entry = defs[i];
          var selected = msState[entry.column];
          if (!selected || selected.size === 0) continue;
          var parts = splitMultiValue(entry.column, row[entry.column] || '')
            .map(function(p) { return normalizeMultiSelectValue(entry.column, p); })
            .filter(Boolean);
          if (!parts.some(function(p) { return selected.has(p); })) return false;
        }

        if (search) {
          var haystack = searchFields.map(function(f) { return row[f] || ''; }).join(' ').toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      });

      // Update map layer
      incidentsLayer.update(filtered);

      currentFilteredRows = filtered;
      renderTable(filtered);

      if (document.getElementById('metricsPanel').style.display !== 'none') {
        renderMetrics(filtered);
      }

      // Refresh whichever non-base layer is currently active, if any —
      // heatmapLayerId/categoricalLayers are populated by buildMapLayers()
      // from schema.layers, so this covers any schema's layer set, not just
      // SEA's specific 'arms-score'/'crime-convergence' pair.
      var activeLayer = document.querySelector('.layer-btn input:checked');
      var activeVal = activeLayer && activeLayer.value;
      if (activeVal && activeVal === heatmapLayerId) {
        updateArmsHeatmap(filtered);
      } else if (activeVal && categoricalLayers[activeVal] && activeVal !== baseCategoricalLayerId) {
        categoricalLayers[activeVal].update(filtered);
      }
    }

    // LEGEND
    // Thin wrappers around incidentsLayer (a createCategoricalLayer instance
    // — see buildMapLayers() above). Kept as top-level function names since
    // switchCountry() and the layer-tab radio handler call them by name.
    function buildLegend() {
      incidentsLayer.buildLegend(incidents);
    }

    function applyIncidentTypeFilter() {
      incidentsLayer.applyFilter();
    }

    // STEP 7: RENDER TABLE
    function escHtml(s) {
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildWeaponsHtml(row) {
      var text = (row['Weapons'] || '').trim();
      if (!text) return '<span class="expand-none">No weapons recorded</span>';
      var lines = text.split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean);
if (lines.length === 1) lines = text.split(/;/).map(function(s){ return s.trim(); }).filter(Boolean);
      return lines.map(function(l){ return '<div class="expand-text">' + escHtml(l) + '</div>'; }).join('');
    }

    // Table columns/expand fields come from schema.table, falling back to
    // SEA's original 5-column layout if schema.json didn't load. A label
    // override and per-column renderer registry stay in code (like the popup
    // templates in the map layers) since exact presentation — truncation
    // length, badge styling, numeric formatting — is display detail, not
    // data the schema needs to carry.
    function tableColumns() {
      return (SCHEMA && SCHEMA.table && SCHEMA.table.columns && SCHEMA.table.columns.length)
        ? SCHEMA.table.columns
        : ['Date', 'Incident Type', 'Title', 'Location', 'Arms Score'];
    }

    function tableExpandFields() {
      return (SCHEMA && SCHEMA.table && SCHEMA.table.expandFields && SCHEMA.table.expandFields.length)
        ? SCHEMA.table.expandFields
        : ['Description', 'Weapons'];
    }

    function columnType(name) {
      var colDef = getColumnDef(name);
      return colDef ? colDef.type : 'text';
    }

    var TABLE_LABEL_OVERRIDES = { 'Incident Type': 'Type' };

    var TABLE_CELL_RENDERERS = {
      'Title': function(row) {
        var title = row['Title'] || '--';
        var short = title.length > 90 ? title.substring(0, 90) + '...' : title;
        return { html: escHtml(short), title: title };
      },
      'Location': function(row) {
        var loc = row['Location'] || '--';
        var short = loc.length > 40 ? loc.substring(0, 40) + '...' : loc;
        return { html: escHtml(short), title: loc };
      },
    };

    // The badge-styled column (colored by whichever column the base
    // categorical layer uses — 'Incident Type' for SEA) and the
    // decimal-formatted numeric column (whichever column the weighted-heatmap
    // layer uses — 'Arms Score' for SEA) are resolved dynamically here rather
    // than matched by hardcoded column-name strings, so a client whose base
    // layer or heatmap points at differently-named columns still gets
    // correctly colored badges and formatted scores without any code change.
    function renderTableCell(row, col) {
      if (incidentsLayer && col === incidentsLayer.column) {
        var val = row[col] || '--';
        var color = incidentsLayer.colorFor(row[col]);
        return { html: '<span class="type-badge" style="background:' + color + '">' + escHtml(val) + '</span>' };
      }
      if (heatmapColumnName && col === heatmapColumnName) {
        return { html: row[col] ? parseFloat(row[col]).toFixed(1) : '--' };
      }
      var renderer = TABLE_CELL_RENDERERS[col];
      if (renderer) return renderer(row);
      return { html: escHtml(row[col] || '--') };
    }

    // Per-expand-field presentation: which wrapper class to use, and whether
    // to omit the whole section when there's nothing to show (Description)
    // versus always showing a placeholder (Weapons — "No weapons recorded").
    var EXPAND_FIELD_CONFIG = {
      'Description': {
        wrapperClass: 'expand-text',
        skipIfEmpty: true,
        render: function(row) { return escHtml(row['Description'] || ''); }
      },
      'Weapons': {
        wrapperClass: 'expand-weapons',
        skipIfEmpty: false,
        render: function(row) { return buildWeaponsHtml(row); }
      },
    };

    function renderExpandSection(row, field) {
      var cfg = EXPAND_FIELD_CONFIG[field] || {
        wrapperClass: 'expand-text',
        skipIfEmpty: true,
        render: function(r) { return escHtml(r[field] || ''); }
      };
      var content = cfg.render(row);
      if (cfg.skipIfEmpty && (!content || !String(content).trim())) return '';
      return '<div class="expand-section"><div class="expand-label">' + escHtml(field) + '</div><div class="' + cfg.wrapperClass + '">' + content + '</div></div>';
    }

    function buildTableHead() {
      var cols = tableColumns();
      var thead = document.querySelector('#incidentTable thead');
      thead.innerHTML = '<tr>' + cols.map(function(col) {
        var label = TABLE_LABEL_OVERRIDES[col] || col;
        return '<th data-col="' + escHtml(col) + '">' + escHtml(label) + ' <span class="sort-icon">&#8597;</span></th>';
      }).join('') + '</tr>';

      thead.querySelectorAll('th[data-col]').forEach(function(th) {
        th.addEventListener('click', function() {
          var col = th.dataset.col;
          if (sortCol === col) {
            sortAsc = !sortAsc;
          } else {
            sortCol = col;
            sortAsc = true;
          }

          var isNumeric = columnType(col) === 'number';
          var sorted = incidents.slice().sort(function(a, b) {
            var av = a[col] || '';
            var bv = b[col] || '';
            if (isNumeric) return sortAsc ? parseFloat(av||0) - parseFloat(bv||0) : parseFloat(bv||0) - parseFloat(av||0);
            return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
          });

          document.querySelectorAll('.sort-icon').forEach(function(el) { el.textContent = String.fromCharCode(8597); });
          th.querySelector('.sort-icon').textContent = sortAsc ? String.fromCharCode(8593) : String.fromCharCode(8595);

          renderTable(sorted);
        });
      });
    }

    function renderTable(rows) {
      var cols = tableColumns();
      var expandFields = tableExpandFields();
      var totalCols = cols.length;

      var tbody = document.getElementById('tableBody');
      document.getElementById('tableCount').textContent =
        rows.length + ' incident' + (rows.length !== 1 ? 's' : '');

      if (!rows.length) {
        tbody.innerHTML = '<tr class="placeholder-row"><td colspan="' + totalCols + '">No incidents to display.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(function(row) {
        var origIdx = incidents.indexOf(row);
        var isActive = origIdx === activeRowId;

        var cellsHtml = cols.map(function(col) {
          var cell = renderTableCell(row, col);
          var titleAttr = cell.title ? ' title="' + escHtml(cell.title) + '"' : '';
          return '<td' + titleAttr + '>' + cell.html + '</td>';
        }).join('');

        var expandHtml = expandFields.map(function(f) { return renderExpandSection(row, f); }).join('');

        return '<tr data-id="' + origIdx + '" class="main-row' + (isActive ? ' active' : '') + '">' +
          cellsHtml +
          '</tr>' +
          '<tr class="expand-row" data-expand-id="' + origIdx + '">' +
          '<td colspan="' + Math.max(totalCols - 1, 1) + '">' +
          '<div class="expand-body">' + expandHtml + '</div>' +
          '</td>' +
          (function() {
            var src = row['Source'] || '';
            if (!src) return '<td class="expand-source-cell"></td>';
            var isUrl = /^https?:\/\//i.test(src.trim());
            if (isUrl) {
              return '<td class="expand-source-cell">' +
                '<a href="' + escHtml(src.trim()) + '" target="_blank" rel="noopener" class="expand-source-icon" title="Open source">' +
                '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>' +
                '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>' +
                '</svg>' +
                '</a></td>';
            }
            return '<td class="expand-source-cell"><span class="expand-source-text" title="' + escHtml(src) + '">' + escHtml(src.length > 20 ? src.slice(0,18)+'…' : src) + '</span></td>';
          })() +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('tr.main-row').forEach(function(tr) {
        tr.addEventListener('click', function() {
          var id = parseInt(tr.dataset.id);
          var row = incidents[id];
          var lng = parseFloat(row['Longitude']);
          var lat = parseFloat(row['Latitude']);

          // Toggle expand row
          var expandRow = tbody.querySelector('tr.expand-row[data-expand-id="' + id + '"]');
          var isOpen = expandRow.classList.contains('open');

          // Close all other expand rows
          tbody.querySelectorAll('tr.expand-row.open').forEach(function(er) { er.classList.remove('open'); });

          if (!isOpen) expandRow.classList.add('open');

          // Fly and popup
          map.flyTo({ center: [lng, lat], zoom: 10, speed: 1.2 });

          if (activePopup) activePopup.remove();
          activePopup = new maplibregl.Popup({ maxWidth: '280px', offset: 12 })
            .setLngLat([lng, lat])
            .setHTML(
              '<strong>' + escHtml(row['Incident Type'] || '') + '</strong>' +
              '<div class="popup-title">' + escHtml(row['Title'] || '') + '</div>' +
              '<div class="popup-meta">' +
              '<span>Date: ' + escHtml(row['Date'] || '') + '</span>' +
              (row['Location'] ? '<span>' + escHtml(row['Location']) + '</span>' : '') +
              (row['Arms Score']       ? '<span>Score: ' + parseFloat(row['Arms Score']).toFixed(1) + '</span>' : '') +
              (row['Convergence'] ? '<span>Convergence: ' + escHtml(row['Convergence']) + '</span>' : '') +
              '</div>'
            )
            .addTo(map);

          highlightRow(id);
        });
      });
    }

    // STEP 8: HIGHLIGHT ROW + MARKER
    function highlightRow(id) {
      activeRowId = id;
      document.querySelectorAll('#tableBody tr.main-row').forEach(function(tr) {
        tr.classList.toggle('active', parseInt(tr.dataset.id) === id);
      });
      var activeEl = document.querySelector('#tableBody tr.main-row[data-id="' + id + '"]');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // Column sort-click handlers are now attached inside buildTableHead(),
    // since the header itself is generated dynamically from schema.table.columns
    // rather than static HTML — see buildTableHead() above.

    // ── ARMS SCORE HEATMAP ──────────────────────────────────────
    // updateArmsHeatmap is still called from applyFilters() below to refresh
    // the heatmap when filters change. Activation/deactivation is now
    // dispatched through layerControllers (see buildMapLayers() and
    // buildLayerNav() above) instead of dedicated wrapper functions.
    function updateArmsHeatmap(rows) {
      if (armsHeatmapLayer) armsHeatmapLayer.update(rows);
    }

    // Crime Convergence and Arms Score tab activation/deactivation are now
    // dispatched generically through layerControllers, built in
    // buildMapLayers() and wired to the tab strip in buildLayerNav() (both
    // above) — see activateOverlayCategoricalLayer() for what used to be
    // Convergence-specific activateConvergenceTab()/deactivateConvergenceTab().

    // ── METRICS ─────────────────────────────────────────────────

    var currentFilteredRows = [];
    var metricsCharts = {};

    // Fallback used only if schema.json fails to load — SEA's exact original
    // 7-chart layout, reconstructed as chart definitions in the same shape
    // schema.json's metrics.sections uses. Everything below reads chart
    // definitions from SCHEMA when available and falls back to this only on
    // load failure, so this list is not something future clients touch.
    var FALLBACK_METRICS_SECTIONS = [
      {
        title: 'Weapons',
        rowLayout: 'nowrap',
        charts: [
          { id: 'chartFirearms', kind: 'horiz-bar', title: 'Firearms by Type', groups: [
            { label: 'Unspecified',      cols: ['Unspecified'] },
            { label: 'Handgun',          cols: ['Pistol', 'Revolver', 'Craft handgun'] },
            { label: 'Assault Rifle',    cols: ['Assault Rifle'] },
            { label: 'Rifle',            cols: ['Rifle', 'Craft Rifle'] },
            { label: 'Shotgun',          cols: ['Shotgun', 'Craft Shotgun'] },
            { label: 'Submachine Gun',   cols: ['SMG', 'Craft SMG'] },
            { label: 'Machine Gun',      cols: ['LMG', 'HMG'] },
            { label: 'Grenade Launcher', cols: ['GL', 'AGL'] },
            { label: 'Anti-tank',        cols: ['RPG/ATW', 'Craft RPG'] },
            { label: 'Mortar',           cols: ['Mortar'] },
            { label: 'Advanced Weapon',  cols: ['ATGM', 'MANPADS'] },
          ] },
          { id: 'chartGrenades', kind: 'horiz-bar', title: 'Grenades & Munitions by Type', color: '#c0392b', groups: [
            { label: 'Hand Grenade',      cols: ['Hand Grenade'] },
            { label: 'Projected Grenade', cols: ['Projected Gren'] },
            { label: 'Rifle Grenade',     cols: ['Rifle Gren'] },
            { label: 'Munition',          cols: ['Munition'] },
          ] },
          { id: 'chartAmmo', kind: 'single-bar', title: 'Ammunition', column: 'Ammo' },
        ]
      },
      {
        title: 'Incidents',
        charts: [
          { id: 'chartIncidentType', kind: 'pie', title: 'Incident Type Breakdown', column: 'Incident Type' },
          { id: 'chartConvergence', kind: 'horiz-bar', title: 'Convergence Incidents by Category', column: 'Convergence', color: '#4d90c4' },
        ]
      },
      {
        title: 'Geography',
        charts: [
          { id: 'chartProvinces', kind: 'vert-bar', title: 'Top 10 Locations by Incident Count', column: 'Location', aggregate: 'count', limit: 10, groupByLastSegment: true },
          { id: 'chartArmsScore', kind: 'vert-bar', title: 'Top 10 Locations by Arms Score', column: 'Location', aggregate: 'sum', sumColumn: 'Arms Score', limit: 10, groupByLastSegment: true, roundSum: true },
        ]
      },
    ];

    // Generalizes getActorTypeVocab()'s lookup to any column with a `vocab`
    // reference in schema.columns — used by chart kinds that need to match
    // free-text values against a controlled vocabulary (e.g. Convergence).
    function getVocabForColumn(columnName) {
      if (!SCHEMA) return null;
      var colDef = (SCHEMA.columns || []).filter(function(c) { return c.name === columnName; })[0];
      var path = colDef && colDef.vocab;
      var list = path && SCHEMA.vocabs && SCHEMA.vocabs[path];
      return (list && list.length) ? list : null;
    }

    function sumGroups(rows, groups) {
      return groups.map(function(g) {
        var total = 0;
        rows.forEach(function(row) {
          g.cols.forEach(function(col) {
            var v = parseFloat(row[col]);
            if (!isNaN(v)) total += v;
          });
        });
        return { label: g.label, value: total };
      });
    }

    function sumCol(rows, col) {
      var total = 0;
      rows.forEach(function(row) {
        var v = parseFloat(row[col]);
        if (!isNaN(v)) total += v;
      });
      return total;
    }

    // Counts distinct values in a column. If vocabList is given, values are
    // matched against it (case-insensitive prefix match, handles multi-value
    // fields split on comma/semicolon/newline) rather than counted verbatim —
    // this is how Convergence's free-text field maps to its 7 categories.
    function countCategorical(rows, column, vocabList) {
      var counts = {};
      if (vocabList) {
        rows.forEach(function(r) {
          (r[column] || '').trim().split(/[,;\n\r]+/).forEach(function(c) {
            c = c.trim();
            if (!c) return;
            var match = vocabList.filter(function(cat) { return c.toLowerCase().startsWith(cat.toLowerCase()); })[0];
            if (match) counts[match] = (counts[match] || 0) + 1;
          });
        });
      } else {
        rows.forEach(function(r) {
          var t = (r[column] || 'Unknown').trim();
          counts[t] = (counts[t] || 0) + 1;
        });
      }
      return Object.entries(counts).sort(function(a,b){ return b[1]-a[1]; });
    }

    // vert-bar aggregation: count or sum, grouped by a column's raw value —
    // or, for SEA's two Geography charts specifically, by the last
    // comma-separated segment of Location (a province/city proxy; see the
    // groupByLastSegment comment in schema.json — this is a SEA-specific
    // convenience, not a default every client's vert-bar charts would want).
    function computeVertBarData(rows, chartDef) {
      var totals = {};
      rows.forEach(function(row) {
        var raw = (row[chartDef.column] || '').trim();
        if (!raw) return;
        var key = chartDef.groupByLastSegment ? raw.split(',').pop().trim() : raw;
        if (!key) return;
        if (chartDef.aggregate === 'sum') {
          var v = parseFloat(row[chartDef.sumColumn]);
          if (isNaN(v)) return;
          totals[key] = (totals[key] || 0) + v;
        } else {
          totals[key] = (totals[key] || 0) + 1;
        }
      });
      var entries = Object.entries(totals).sort(function(a,b){ return b[1]-a[1]; });
      if (chartDef.limit) entries = entries.slice(0, chartDef.limit);
      return entries;
    }

    function destroyChart(id) {
      if (metricsCharts[id]) { metricsCharts[id].destroy(); delete metricsCharts[id]; }
    }

    var CHART_DEFAULTS = {
      color: '#c9d1d9',
      gridColor: 'rgba(255,255,255,0.06)',
      accent: '#e8962a',
      blue: '#4d90c4',
    };

    // Root-cause fix: the old code replaced the canvas's own parentNode
    // innerHTML with the "No data" message, which deleted the <canvas>
    // element from the DOM entirely. The next render call could never find
    // it again (getElementById returned null), so a chart that ever showed
    // "No data" was stuck that way permanently, even after the filter that
    // caused it was changed or removed. These two helpers hide/show the
    // canvas instead of destroying it, so every render can recover.
    function showChartEmpty(canvasId, message) {
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      ctx.style.display = 'none';
      var wrap = ctx.parentNode;
      var empty = wrap.querySelector('.metrics-empty');
      if (!empty) {
        empty = document.createElement('div');
        empty.className = 'metrics-empty';
        wrap.appendChild(empty);
      }
      empty.textContent = message;
    }

    function clearChartEmpty(canvasId) {
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      ctx.style.display = '';
      var wrap = ctx.parentNode;
      var empty = wrap.querySelector('.metrics-empty');
      if (empty) empty.remove();
    }

    function makeHorizBar(canvasId, labels, data, color) {
      destroyChart(canvasId);
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      clearChartEmpty(canvasId);
      var pairs = labels.map(function(l,i){ return {l:l,v:data[i]}; }).filter(function(p){ return p.v > 0; });
      if (!pairs.length) { showChartEmpty(canvasId, 'No data'); return; }
      pairs.sort(function(a,b){ return b.v - a.v; });
      metricsCharts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: { labels: pairs.map(function(p){return p.l;}), datasets: [{ data: pairs.map(function(p){return p.v;}), backgroundColor: color||CHART_DEFAULTS.accent, borderRadius: 3, borderSkipped: false }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: CHART_DEFAULTS.color, font:{size:11} }, grid: { color: CHART_DEFAULTS.gridColor }, border: { color: 'transparent' } },
